<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ห้องเกมผังงาน</title><meta name="description" content="เกมฝึกอ่านสัญลักษณ์ผังงานและเรียงลำดับขั้นตอนสำหรับนักเรียน">
<style>
:root{font:16px/1.55 Tahoma,system-ui,sans-serif;color:#122f42;background:#eaf7f8;--blue:#075a65;--light:#e8f5f6}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:24px 16px 44px}header{background:#073743;color:white;padding:26px clamp(18px,5vw,46px);border-radius:24px 24px 0 0}h1,h2,p{margin:0 0 .65rem}h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.2}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{font:inherit;cursor:pointer;font-weight:700;border:2px solid transparent;border-radius:12px;padding:.65rem .9rem;color:inherit;background:#e5f2f4}button[aria-pressed=true],.primary{background:#087480;color:white}button:focus-visible,select:focus-visible{outline:3px solid #ba6300;outline-offset:3px}article{background:white;border:1px solid #c6e4e8;border-top:0;border-radius:0 0 24px 24px;padding:clamp(12px,4vw,34px)}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.score{background:#fff0bf;padding:.3rem .7rem;border-radius:20px;font-weight:700}.grid{display:grid;grid-template-columns:minmax(85px,1fr) minmax(0,3fr);gap:12px}.col{display:grid;gap:7px;align-content:start}.col h3{margin:0;font-size:.95rem}.card{height:66px;text-align:left;background:#f2f8f9;border-color:#d5e9ec;font-weight:400;padding:5px 8px;line-height:1.27}.card[aria-pressed=true]{border-color:#075a65;background:#d3eff0;color:#122f42}.card.done{background:#dff5e8;color:#175c37;border-color:#9bd5ad}.symbol{display:grid;place-items:center}.mark{display:inline-block;width:54px;height:27px;background:var(--ink);flex:none}.start{border-radius:14px}.flow{background:none;height:auto;font-size:1.4rem;font-weight:900;line-height:1;text-align:center}.manual{clip-path:polygon(0 20%,100% 0,100% 100%,0 100%)}.decision{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.connection{width:24px;height:24px;border-radius:50%}.display{border-radius:0 8px 8px 0;clip-path:polygon(0 50%,20% 0,100% 0,100% 100%,20% 100%)}.io{transform:skew(-15deg);width:47px}.feedback{background:var(--light);border-radius:12px;padding:10px 12px;min-height:46px}.steps{padding-left:0;list-style:none;display:grid;gap:7px}.step{display:flex;gap:9px;align-items:center;border:1px solid #cee3e6;padding:7px;border-radius:12px}.step .label{flex:1}.moves{display:flex;gap:4px}.moves button{padding:4px 7px;font-size:.85rem}.moves button:disabled{opacity:.4}select{font:inherit;padding:6px;max-width:100%;border-radius:8px;border:1px solid #7ca4aa}.check{border-color:#6cba85;background:#e7f8ed}.wrong{border-color:#e09577;background:#fff2e9}@media(max-width:480px){.card{height:83px}.step{flex-wrap:wrap}.moves{margin-left:auto}.steps .mark{width:36px;height:20px}.steps .connection{width:20px}}
</style>
<main><header><h1>ห้องเกมผังงาน</h1><nav aria-label="เลือกเกม"><button id="chooseMatch" aria-pressed="true">จับคู่สัญลักษณ์</button><button id="chooseOrder" aria-pressed="false">เรียงลำดับขั้นตอน</button></nav></header><article id="game"></article></main>
<script src="game.js" defer></script></html>
