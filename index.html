<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ห้องเกมผังงาน</title><meta name="description" content="เกมฝึกอ่านสัญลักษณ์ผังงานและเรียงลำดับขั้นตอนสำหรับนักเรียน">
<style>
:root{font:16px/1.55 Tahoma,system-ui,sans-serif;color:#122f42;background:#eaf7f8;--blue:#075a65;--light:#e8f5f6}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:24px 16px 44px}header{background:#073743;color:white;padding:26px clamp(18px,5vw,46px);border-radius:24px 24px 0 0}h1,h2,p{margin:0 0 .65rem}h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.2}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button{font:inherit;cursor:pointer;font-weight:700;border:2px solid transparent;border-radius:12px;padding:.65rem .9rem;color:inherit;background:#e5f2f4}button[aria-pressed=true],.primary{background:#087480;color:white}button:focus-visible,select:focus-visible{outline:3px solid #ba6300;outline-offset:3px}article{background:white;border:1px solid #c6e4e8;border-top:0;border-radius:0 0 24px 24px;padding:clamp(12px,4vw,34px)}.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.score{background:#fff0bf;padding:.3rem .7rem;border-radius:20px;font-weight:700}.grid{display:grid;grid-template-columns:minmax(85px,1fr) minmax(0,3fr);gap:12px}.col{display:grid;gap:7px;align-content:start}.col h3{margin:0;font-size:.95rem}.card{height:66px;text-align:left;background:#f2f8f9;border-color:#d5e9ec;font-weight:400;padding:5px 8px;line-height:1.27}.card[aria-pressed=true]{border-color:#075a65;background:#d3eff0;color:#122f42}.card.done{background:#dff5e8;color:#175c37;border-color:#9bd5ad}.symbol{display:grid;place-items:center}.mark{display:inline-block;width:54px;height:27px;background:var(--ink);flex:none}.start{border-radius:14px}.flow{background:none;height:auto;font-size:1.4rem;font-weight:900;line-height:1;text-align:center}.manual{clip-path:polygon(0 20%,100% 0,100% 100%,0 100%)}.decision{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.connection{width:24px;height:24px;border-radius:50%}.display{border-radius:0 8px 8px 0;clip-path:polygon(0 50%,20% 0,100% 0,100% 100%,20% 100%)}.io{transform:skew(-15deg);width:47px}.feedback{background:var(--light);border-radius:12px;padding:10px 12px;min-height:46px}.steps{padding-left:0;list-style:none;display:grid;gap:7px}.step{display:flex;gap:9px;align-items:center;border:1px solid #cee3e6;padding:7px;border-radius:12px}.step .label{flex:1}.moves{display:flex;gap:4px}.moves button{padding:4px 7px;font-size:.85rem}.moves button:disabled{opacity:.4}select{font:inherit;padding:6px;max-width:100%;border-radius:8px;border:1px solid #7ca4aa}.check{border-color:#6cba85;background:#e7f8ed}.wrong{border-color:#e09577;background:#fff2e9}@media(max-width:480px){.card{height:83px}.step{flex-wrap:wrap}.moves{margin-left:auto}.steps .mark{width:36px;height:20px}.steps .connection{width:20px}}
.summary{text-align:center;padding:clamp(15px,5vw,48px) 8px}.result{font-size:3.5rem;font-weight:800;color:#075a65;line-height:1.2}.result span{font-size:1.15rem}.summary progress{width:min(100%,320px);height:1rem;accent-color:#087480;margin:10px auto 18px}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:22px}.link-board{position:relative;display:grid;grid-template-columns:minmax(75px,1fr) minmax(0,1.8fr);gap:clamp(32px,12vw,120px);margin:16px 0}.link-board canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.link-card{position:relative;touch-action:none;user-select:none}.link-card[aria-pressed=true]{outline:2px solid #087480}.link-card.done{opacity:1}.link-board .col:last-child .card{padding-left:12px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:700px;margin-top:22px}
nav button{--accent:#087480;display:flex;align-items:center;gap:9px;min-height:56px;padding:8px 11px;text-align:left;color:#12384a;background:#f5fbfc;border:2px solid #b7d7dd;border-radius:12px;box-shadow:0 3px 0 #021f29;transition:background-color .15s,border-color .15s,transform .15s;line-height:1.2}
nav button:hover{background:#dceff2;border-color:#fff;transform:translateY(-1px)}
nav button[aria-pressed=true]{background:#c5f2e2;color:#12384a;border-color:#8ae4c2;box-shadow:0 3px 0 #08715f}
nav button:focus-visible{outline-color:#ffce6a}
#chooseOrder{--accent:#6641a4}#chooseLink{--accent:#a64a16}
.nav-icon{width:32px;height:32px;display:grid;place-items:center;flex:0 0 32px;border-radius:8px;background:var(--accent);color:white}
.nav-icon svg{width:19px;height:19px}
@media(max-width:560px){nav{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}nav button{display:grid;justify-items:center;align-content:center;text-align:center;gap:5px;padding:6px 2px;min-height:78px;font-size:.875rem}.nav-icon{width:27px;height:27px}.nav-icon svg{width:16px;height:16px}}
@media(prefers-reduced-motion:reduce){nav button{transition:none}}

.link-name-th,.link-name-en{display:block}.link-name-th{font-weight:700}.link-name-en{font-size:.875rem;margin-top:3px;color:#365665}</style>
<main><header><h1>ห้องเกมผังงาน</h1><nav aria-label="เลือกเกม"><button id="chooseLink" aria-pressed="true"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6c9 0 1 12 10 12"/></svg></span><span>โยงเส้นหาคู่</span></button><button id="chooseMatch" aria-pressed="false"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="8" height="8" rx="2"/><rect x="13.5" y="12.5" width="8" height="8" rx="2"/><path d="M14.5 7.5h5m-16 9h5"/></svg></span><span>จับคู่สัญลักษณ์</span></button><button id="chooseOrder" aria-pressed="false"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h12M9 12h12M9 19h12"/><circle cx="4" cy="5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="19" r="1"/></svg></span><span>เรียงลำดับขั้นตอน</span></button></nav></header><article id="game"></article></main>
<script src="game.js?v=4" defer></script><script src="link.js?v=3" defer></script></html>
